services:
  saveany-bot:
    image: ghcr.io/acecandy/saveany-bot:latest
    container_name: saveany-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Web 全局配置会写回宿主机的此文件，随后由上方重启策略重新加载
      - ./config.toml:/app/config.toml
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    # 使用 host 模式以便访问宿主机服务 (如代理)
    # 如果你对 Docker 网络模式熟悉, 可以自行修改
    network_mode: host
